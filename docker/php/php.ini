; Dev PHP tuning. OPcache keeps compiled bytecode in memory so PHP files aren't
; re-parsed on every request. validate_timestamps=1 + revalidate_freq=0 means it
; still notices edited files immediately (important for a bind-mounted dev setup).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Show PHP errors while developing. This lives here (local container only) on
; purpose - it must never reach the live server, so it stays out of .htaccess.
display_errors=On
display_startup_errors=On
html_errors=On
