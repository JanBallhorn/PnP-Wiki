<VirtualHost *:80>
    DocumentRoot /var/www/html/root

    <Directory /var/www/html/root>
        Options Indexes FollowSymLinks
        # AllowOverride All so the app's .htaccess (URL rewriting, hardening)
        # takes effect.
        AllowOverride All
        Require all granted
        # Dev only: never let the browser cache assets, so edited JS/CSS always
        # reloads (Windows bind-mount mtimes are unreliable for 304 handling).
        <IfModule mod_headers.c>
            Header set Cache-Control "no-store"
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
